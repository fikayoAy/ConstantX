<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ConstantX hero banner</title>
  <desc id="desc">Hero banner showing plans transformed into research-backed implementation blocks for Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07130f"/>
      <stop offset="0.58" stop-color="#12382e"/>
      <stop offset="1" stop-color="#f0b35a"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="34%" r="55%">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#82d6b6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#07130f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <path d="M0 276 C168 220 302 302 456 246 C628 184 736 96 902 132 C1030 160 1114 248 1200 208 L1200 360 L0 360 Z" fill="#f7d08a" opacity="0.12"/>
  <path d="M772 65 L1130 65 Q1160 65 1160 95 L1160 280 Q1160 310 1130 310 L772 310 Q742 310 742 280 L742 95 Q742 65 772 65 Z" fill="#fff7e7" opacity="0.96" filter="url(#shadow)"/>
  <text x="80" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#fff7e7">ConstantX</text>
  <text x="84" y="172" font-family="Verdana, sans-serif" font-size="22" fill="#d8f5e8">Plan to papers to specs to implementation.</text>
  <text x="84" y="212" font-family="Verdana, sans-serif" font-size="18" fill="#b8d9cb">An MCP workflow for Codex that keeps research, decisions, code, and verification traceable.</text>
  <g transform="translate(785 94)">
    <rect x="0" y="0" width="110" height="56" rx="14" fill="#12382e"/>
    <text x="55" y="35" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#fff7e7">plan.md</text>
    <rect x="138" y="0" width="126" height="56" rx="14" fill="#1f6b55"/>
    <text x="201" y="35" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#fff7e7">blocks</text>
    <rect x="0" y="86" width="110" height="56" rx="14" fill="#f0b35a"/>
    <text x="55" y="121" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#1c1307">papers</text>
    <rect x="138" y="86" width="126" height="56" rx="14" fill="#e76f51"/>
    <text x="201" y="121" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#fff7e7">spec.md</text>
    <rect x="72" y="172" width="148" height="56" rx="14" fill="#07130f"/>
    <text x="146" y="207" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="700" fill="#fff7e7">implementation</text>
    <path d="M112 28 L132 28" stroke="#12382e" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 58 L56 80" stroke="#12382e" stroke-width="4" stroke-linecap="round"/>
    <path d="M113 114 L132 114" stroke="#12382e" stroke-width="4" stroke-linecap="round"/>
    <path d="M201 144 L164 169" stroke="#12382e" stroke-width="4" stroke-linecap="round"/>
  </g>
